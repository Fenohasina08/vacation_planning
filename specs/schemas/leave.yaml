LeaveRequestStatus:
  type: string
  enum:
  - draft
  - pending
  - approved
  - rejected
  - cancelled
AttachmentPolicy:
  type: string
  enum:
  - none
  - optional
  - required
ScanStatus:
  type: string
  enum:
  - pending
  - clean
  - infected
DayPart:
  type: string
  enum:
  - full
  - morning
  - afternoon
LeaveTypeInput:
  type: object
  properties:
    code:
      type: string
      maxLength: 40
    name:
      type: string
    deducts_balance:
      type: boolean
    attachment_policy:
      $ref: ../openapi.yaml#/components/schemas/AttachmentPolicy
    is_confidential:
      type: boolean
    color:
      type: string
      pattern: ^#[0-9A-Fa-f]{6}$
    min_notice_days:
      type: integer
      minimum: 0
    max_consecutive_days:
      type: integer
      minimum: 1
      nullable: true
    approval_workflow_id:
      type: string
      format: uuid
      nullable: true
    is_active:
      type: boolean
LeaveType:
  allOf:
  - $ref: ../openapi.yaml#/components/schemas/LeaveTypeInput
  - type: object
    required:
    - id
    - code
    - name
    properties:
      id:
        type: string
        format: uuid
LeavePolicyInput:
  type: object
  required:
  - effective_from
  properties:
    annual_entitlement_days:
      type: number
      minimum: 0
      nullable: true
    accrual_mode:
      type: string
      enum:
      - none
      - upfront
      - monthly
      nullable: true
    carry_over_max_days:
      type: number
      minimum: 0
      nullable: true
    carry_over_expires_after_months:
      type: integer
      minimum: 1
      nullable: true
    effective_from:
      type: string
      format: date
    effective_to:
      type: string
      format: date
      nullable: true
LeavePolicy:
  allOf:
  - $ref: ../openapi.yaml#/components/schemas/LeavePolicyInput
  - type: object
    required:
    - id
    - leave_type_id
    properties:
      id:
        type: string
        format: uuid
      leave_type_id:
        type: string
        format: uuid
LeaveRequestInput:
  type: object
  required:
  - leave_type_id
  - start_date
  - end_date
  properties:
    employee_id:
      type: string
      format: uuid
      description: Réservé aux RH qui saisissent pour un employé ; ignoré sinon
    leave_type_id:
      type: string
      format: uuid
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    start_part:
      type: string
      enum:
      - full
      - afternoon
      default: full
      description: À préciser (demi-journées)
    end_part:
      type: string
      enum:
      - full
      - morning
      default: full
    is_urgent:
      type: boolean
      default: false
    reason:
      type: string
      maxLength: 2000
      description: Confidentiel
    submit:
      type: boolean
      default: false
      description: Soumettre immédiatement au lieu d'enregistrer un brouillon
LeaveRequestPreview:
  type: object
  required:
  - days_count
  - valid
  properties:
    valid:
      type: boolean
    days_count:
      type: number
    balance_available_before:
      type: number
      nullable: true
    balance_available_after:
      type: number
      nullable: true
    attachment_required:
      type: boolean
    conflicts:
      type: array
      items:
        type: object
        required:
        - kind
        - message
        properties:
          kind:
            type: string
            enum:
            - own_overlap
            - absence_limit
            - notice
            - max_consecutive
            - insufficient_balance
          message:
            type: string
          blocking:
            type: boolean
LeaveRequest:
  type: object
  required:
  - id
  - employee_id
  - leave_type_id
  - start_date
  - end_date
  - days_count
  - status
  properties:
    id:
      type: string
      format: uuid
    employee_id:
      type: string
      format: uuid
    leave_type_id:
      type: string
      format: uuid
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    start_part:
      type: string
      enum:
      - full
      - afternoon
    end_part:
      type: string
      enum:
      - full
      - morning
    days_count:
      type: number
    status:
      $ref: ../openapi.yaml#/components/schemas/LeaveRequestStatus
    is_urgent:
      type: boolean
    reason:
      type: string
      nullable: true
      description: Présent uniquement pour le demandeur et les rôles autorisés
    parent_request_id:
      type: string
      format: uuid
      nullable: true
    decisions:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/Decision
    submitted_at:
      type: string
      format: date-time
      nullable: true
    decided_at:
      type: string
      format: date-time
      nullable: true
    cancelled_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
Attachment:
  type: object
  required:
  - id
  - original_name
  - mime_type
  - size_bytes
  - scan_status
  properties:
    id:
      type: string
      format: uuid
    original_name:
      type: string
    mime_type:
      type: string
    size_bytes:
      type: integer
    scan_status:
      $ref: ../openapi.yaml#/components/schemas/ScanStatus
    created_at:
      type: string
      format: date-time
