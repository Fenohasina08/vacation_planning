/leave-types:
  get:
    tags:
    - Types de congés
    operationId: listLeaveTypes
    summary: Types de congés de l'entreprise
    x-roles:
    - employee
    - manager
    - hr
    - director
    parameters:
    - name: active_only
      in: query
      schema:
        type: boolean
        default: true
    responses:
      '200':
        description: Liste
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/LeaveType
  post:
    tags:
    - Types de congés
    operationId: createLeaveType
    summary: Créer un type de congé (FONC-020)
    x-roles:
    - hr
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LeaveTypeInput
    responses:
      '201':
        description: Créé
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveType
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-types/{id}:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  patch:
    tags:
    - Types de congés
    operationId: updateLeaveType
    summary: Modifier ou désactiver un type de congé
    x-roles:
    - hr
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LeaveTypeInput
    responses:
      '200':
        description: Modifié
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveType
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-types/{id}/policies:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  get:
    tags:
    - Types de congés
    operationId: listLeavePolicies
    summary: Règles d'acquisition, de report et d'expiration (À préciser, RG-012)
    x-roles:
    - hr
    responses:
      '200':
        description: Règles
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/LeavePolicy
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
  post:
    tags:
    - Types de congés
    operationId: createLeavePolicy
    summary: Ajouter une règle pour ce type
    x-roles:
    - hr
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LeavePolicyInput
    responses:
      '201':
        description: Créée
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeavePolicy
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-requests:
  get:
    tags:
    - Demandes de congé
    operationId: listLeaveRequests
    summary: Lister les demandes visibles (les siennes pour un employé)
    x-roles:
    - employee
    - manager
    - hr
    - director
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/Limit
    - $ref: ../openapi.yaml#/components/parameters/Cursor
    - name: employee_id
      in: query
      schema:
        type: string
        format: uuid
    - name: status
      in: query
      schema:
        $ref: ../openapi.yaml#/components/schemas/LeaveRequestStatus
    - name: from
      in: query
      schema:
        type: string
        format: date
    - name: to
      in: query
      schema:
        type: string
        format: date
    responses:
      '200':
        description: Page de demandes
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/LeaveRequest
                next_cursor:
                  type: string
                  nullable: true
  post:
    tags:
    - Demandes de congé
    operationId: createLeaveRequest
    summary: Créer une demande (brouillon ou soumission directe)
    description: 'Contrôles serveur : dates, solde, chevauchements, préavis, justificatif, limites d''absences. `Idempotency-Key`
      évite les doublons en cas de double clic.'
    x-roles:
    - employee
    - manager
    - hr
    - director
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LeaveRequestInput
    responses:
      '201':
        description: Demande créée
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveRequest
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-requests/preview:
  post:
    tags:
    - Demandes de congé
    operationId: previewLeaveRequest
    summary: Simuler une demande (nombre de jours, solde, conflits, alertes) sans l'enregistrer
    x-roles:
    - employee
    - manager
    - hr
    - director
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LeaveRequestInput
    responses:
      '200':
        description: Résultat de la simulation
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveRequestPreview
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-requests/{id}:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  get:
    tags:
    - Demandes de congé
    operationId: getLeaveRequest
    summary: Détail d'une demande avec historique des décisions
    x-roles:
    - employee
    - manager
    - hr
    - director
    responses:
      '200':
        description: Demande
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveRequest
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
  patch:
    tags:
    - Demandes de congé
    operationId: updateLeaveRequest
    summary: Modifier un brouillon
    x-roles:
    - employee
    - manager
    - hr
    - director
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LeaveRequestInput
    responses:
      '200':
        description: Demande modifiée
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveRequest
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-requests/{id}/submit:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  post:
    tags:
    - Demandes de congé
    operationId: submitLeaveRequest
    summary: Soumettre un brouillon au circuit de validation
    x-roles:
    - employee
    - manager
    - hr
    - director
    responses:
      '200':
        description: Demande soumise
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveRequest
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-requests/{id}/cancel:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  post:
    tags:
    - Demandes de congé
    operationId: cancelLeaveRequest
    summary: Annuler une demande selon les règles de l'entreprise (FONC-029)
    x-roles:
    - employee
    - manager
    - hr
    - director
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
    responses:
      '200':
        description: Demande annulée ; solde recrédité si elle était approuvée
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveRequest
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
/leave-requests/{id}/modification-requests:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  post:
    tags:
    - Demandes de congé
    operationId: createModificationRequest
    summary: Demander la modification d'une demande approuvée (nouvelle demande liée, soumise au circuit)
    x-roles:
    - employee
    - manager
    - hr
    - director
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LeaveRequestInput
    responses:
      '201':
        description: Demande de modification créée
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LeaveRequest
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-requests/{id}/attachments:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  get:
    tags:
    - Demandes de congé
    operationId: listAttachments
    summary: Justificatifs d'une demande (demandeur et rôles autorisés)
    x-roles:
    - employee
    - hr
    responses:
      '200':
        description: Liste
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/Attachment
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
  post:
    tags:
    - Demandes de congé
    operationId: uploadAttachment
    summary: Ajouter un justificatif (type réel contrôlé, analyse antivirus — SEC-020)
    x-roles:
    - employee
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: Justificatif reçu (analyse en cours)
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Attachment
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '413':
        $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationError
/leave-requests/{id}/attachments/{attachmentId}:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/Id
  - name: attachmentId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    tags:
    - Demandes de congé
    operationId: downloadAttachment
    summary: Télécharger un justificatif (redirection vers une URL signée de courte durée)
    x-roles:
    - employee
    - hr
    responses:
      '302':
        description: Redirection vers l'URL signée
        headers:
          Location:
            schema:
              type: string
              format: uri
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
  delete:
    tags:
    - Demandes de congé
    operationId: deleteAttachment
    summary: Supprimer un justificatif tant que la demande n'est pas décidée
    x-roles:
    - employee
    responses:
      '204':
        description: Supprimé
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
