/platform/auth/login:
  post:
    tags:
    - Plateforme
    operationId: platformLogin
    summary: Connexion d'un administrateur de plateforme (étape 1) ; MFA obligatoire
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - email
            - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    responses:
      '200':
        description: Code de vérification envoyé
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge_id
              properties:
                challenge_id:
                  type: string
                  format: uuid
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
/platform/auth/login/verify-otp:
  post:
    tags:
    - Plateforme
    operationId: platformVerifyOtp
    summary: Code de vérification (étape 2) et ouverture de session plateforme
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - challenge_id
            - code
            properties:
              challenge_id:
                type: string
                format: uuid
              code:
                type: string
                pattern: ^[0-9]{6}$
    responses:
      '200':
        description: Session plateforme ouverte (cookie)
        headers:
          Set-Cookie:
            schema:
              type: string
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '429':
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
