schemas:
  Problem:
    type: object
    required:
    - type
    - title
    - status
    properties:
      type:
        type: string
        description: URI ou code stable, ex. leave.overlap
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
      request_id:
        type: string
      errors:
        type: array
        items:
          type: object
          required:
          - field
          - message
          properties:
            field:
              type: string
            message:
              type: string
