openapi: 3.0.3
info:
  title: API du SaaS de gestion des congés et absences (nom du projet à choisir)
  version: 0.1.0
  license:
    name: MIT (ou autre)
    url: https://opensource.org/licenses/MIT
  description: >
    Spécification de l'API REST du Produit IT Solution. **Proposition à
    valider** : elle découle du cahier

    des charges v0.1 et du schéma SQL 01_schema.sql.


    **Règles transverses**

    - **Isolation (ISO-002, ISO-003).** L'entreprise active est déduite de la
    session côté serveur. Aucun
      endpoint « entreprise » n'accepte un `company_id` dans le chemin, la requête ou le corps. Un identifiant
      d'une autre entreprise renvoie `404`, jamais `403`, pour ne pas révéler son existence.
    - **Permissions.** Chaque opération indique les rôles autorisés dans
    `x-roles` (`employee`, `manager`
      (dérivé de la hiérarchie), `hr`, `director`, `platform`). Les contrôles sont faits côté serveur ; `x-roles`
      documente l'intention, il ne remplace pas le contrôle.
    - **Sessions.** Cookie `HttpOnly`, `Secure`, `SameSite`. Les requêtes qui
    modifient des données exigent
      l'en-tête `X-CSRF-Token`.
    - **Confidentialité.** Les champs `reason` (motifs) et les justificatifs ne
    sont renvoyés qu'au demandeur et
      aux rôles autorisés. Calendriers, notifications et exports génériques ne les contiennent jamais.
    - **Erreurs.** Format `application/problem+json` (RFC 7807). `404` pour
    toute ressource hors entreprise.

    - **Pagination.** Par curseur : `limit` et `cursor`, réponse `{ data,
    next_cursor }`.

    - **Statuts d'exigence.** Les valeurs marquées « À préciser »
    (demi-journées, solde négatif, demandes
      urgentes, durée des invitations, etc.) sont paramétrables ; les contrats ci-dessous ne les fixent pas.
  contact:
    name: IT Solution
