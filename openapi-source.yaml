openapi: 3.0.3
info:
  title: API du SaaS de gestion des congés et absences (nom du projet à choisir)
  version: 0.1.0
  description: |
    Spécification de l'API REST du Produit IT Solution. **Proposition à valider** : elle découle du cahier
    des charges v0.1 et du schéma SQL 01_schema.sql.

    **Règles transverses**
    - **Isolation (ISO-002, ISO-003).** L'entreprise active est déduite de la session côté serveur. Aucun
      endpoint « entreprise » n'accepte un `company_id` dans le chemin, la requête ou le corps. Un identifiant
      d'une autre entreprise renvoie `404`, jamais `403`, pour ne pas révéler son existence.
    - **Permissions.** Chaque opération indique les rôles autorisés dans `x-roles` (`employee`, `manager`
      (dérivé de la hiérarchie), `hr`, `director`, `platform`). Les contrôles sont faits côté serveur ; `x-roles`
      documente l'intention, il ne remplace pas le contrôle.
    - **Sessions.** Cookie `HttpOnly`, `Secure`, `SameSite`. Les requêtes qui modifient des données exigent
      l'en-tête `X-CSRF-Token`.
    - **Confidentialité.** Les champs `reason` (motifs) et les justificatifs ne sont renvoyés qu'au demandeur et
      aux rôles autorisés. Calendriers, notifications et exports génériques ne les contiennent jamais.
    - **Erreurs.** Format `application/problem+json` (RFC 7807). `404` pour toute ressource hors entreprise.
    - **Pagination.** Par curseur : `limit` et `cursor`, réponse `{ data, next_cursor }`.
    - **Statuts d'exigence.** Les valeurs marquées « À préciser » (demi-journées, solde négatif, demandes
      urgentes, durée des invitations, etc.) sont paramétrables ; les contrats ci-dessous ne les fixent pas.
  contact:
    name: IT Solution
servers:
  - url: https://api.example.invalid/v1
    description: Production (URL à définir)
  - url: https://api-test.example.invalid/v1
    description: Test (URL à définir)
tags:
  - {name: Santé}
  - {name: Authentification}
  - {name: Entreprise}
  - {name: Organisation}
  - {name: Employés}
  - {name: Types de congés}
  - {name: Circuits de validation}
  - {name: Demandes de congé}
  - {name: Validations}
  - {name: Soldes}
  - {name: Calendrier et disponibilité}
  - {name: Tableau de bord}
  - {name: Exports}
  - {name: Notifications}
  - {name: Abonnement}
  - {name: Support}
  - {name: Audit}
  - {name: Plateforme}
security:
  - sessionCookie: []
    csrfToken: []
paths:
  /health:
    get:
      tags: [Santé]
      operationId: getHealth
      summary: État du service (sans donnée métier)
      security: []
      responses:
        '200':
          description: Service disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
                  version: {type: string}

  # ------------------------------------------------------------------ Authentification
  /auth/register-company:
    post:
      tags: [Authentification]
      operationId: registerCompany
      summary: Inscrire une entreprise (FONC-001)
      description: Crée l'entreprise en attente de vérification, le premier compte RH et envoie le courriel de vérification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name, first_name, last_name, email, password]
              properties:
                company_name: {type: string, maxLength: 200}
                first_name: {type: string}
                last_name: {type: string}
                email: {type: string, format: email}
                password: {type: string, format: password, minLength: 12}
                country_code: {type: string, minLength: 2, maxLength: 2}
      responses:
        '202':
          description: Courriel de vérification envoyé (réponse identique que l'adresse existe déjà ou non)
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/verify-email:
    post:
      tags: [Authentification]
      operationId: verifyEmail
      summary: Vérifier une adresse électronique (SEC-004)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '204': {description: Adresse vérifiée ; espace de travail créé}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Connexion par courriel et mot de passe (étape 1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Mot de passe correct ; un code de vérification est envoyé par courriel (SEC-002)
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id]
                properties:
                  challenge_id: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/login/verify-otp:
    post:
      tags: [Authentification]
      operationId: verifyLoginOtp
      summary: Code de vérification (étape 2) et ouverture de session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: {type: string, format: uuid}
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200':
          description: Session ouverte (cookie). Si le compte a plusieurs entreprises, `company_selection_required` vaut true.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [company_selection_required]
                properties:
                  company_selection_required: {type: boolean}
                  csrf_token: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Fermer la session courante
      responses:
        '204': {description: Session révoquée}
  /auth/logout-all:
    post:
      tags: [Authentification]
      operationId: logoutAll
      summary: Révoquer toutes les sessions du compte
      responses:
        '204': {description: Sessions révoquées}
  /auth/password/forgot:
    post:
      tags: [Authentification]
      operationId: forgotPassword
      summary: Demander une réinitialisation (réponse identique si le compte n'existe pas)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: "Si le compte existe, un courriel est envoyé"}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/password/reset:
    post:
      tags: [Authentification]
      operationId: resetPassword
      summary: Définir un nouveau mot de passe (lien à usage unique, SEC-005)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: {type: string}
                new_password: {type: string, format: password, minLength: 12}
      responses:
        '204': {description: Mot de passe modifié ; sessions précédentes révoquées}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/invitations/accept:
    post:
      tags: [Authentification]
      operationId: acceptInvitation
      summary: Activer un compte à partir d'une invitation (FONC-013)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, format: password, minLength: 12}
      responses:
        '204': {description: Compte activé}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/memberships:
    get:
      tags: [Authentification]
      operationId: listMemberships
      summary: Entreprises auxquelles le compte est rattaché
      responses:
        '200':
          description: Liste des rattachements actifs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/select-company:
    post:
      tags: [Authentification]
      operationId: selectCompany
      summary: Choisir l'entreprise active de la session
      description: Le serveur vérifie que le compte possède un rattachement actif ; l'identifiant n'est jamais accepté sans cette vérification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id]
              properties:
                employee_id: {type: string, format: uuid}
      responses:
        '204': {description: Entreprise active mise à jour}
        '404': {$ref: '#/components/responses/NotFound'}
  /me:
    get:
      tags: [Authentification]
      operationId: getMe
      summary: Profil de l'utilisateur connecté, rôle et permissions effectives
      x-roles: [employee, manager, hr, director]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # ------------------------------------------------------------------ Entreprise
  /company:
    get:
      tags: [Entreprise]
      operationId: getCompany
      summary: Entreprise active
      x-roles: [employee, manager, hr, director]
      responses:
        '200':
          description: Entreprise
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
    patch:
      tags: [Entreprise]
      operationId: updateCompany
      summary: Modifier le nom, le pays ou le fuseau horaire
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                country_code: {type: string, minLength: 2, maxLength: 2}
                timezone: {type: string, example: Indian/Antananarivo}
      responses:
        '200':
          description: Entreprise modifiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /company/settings:
    get:
      tags: [Entreprise]
      operationId: getCompanySettings
      summary: Paramètres de l'entreprise
      x-roles: [hr, director]
      responses:
        '200':
          description: Paramètres
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanySettings'}
    patch:
      tags: [Entreprise]
      operationId: updateCompanySettings
      summary: Modifier les paramètres (jours ouvrés, règles, validations) — journalisé
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanySettings'}
      responses:
        '200':
          description: Paramètres modifiés
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanySettings'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /company/holidays:
    get:
      tags: [Entreprise]
      operationId: listHolidays
      summary: Jours fériés
      x-roles: [employee, manager, hr, director]
      parameters:
        - {name: year, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Jours fériés
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Holiday'}}
    post:
      tags: [Entreprise]
      operationId: createHoliday
      summary: Ajouter un jour férié
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolidayInput'}
      responses:
        '201':
          description: Jour férié créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Holiday'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /company/holidays/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Entreprise]
      operationId: deleteHoliday
      summary: Supprimer un jour férié
      x-roles: [hr]
      responses:
        '204': {description: Supprimé}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ Organisation
  /departments:
    get:
      tags: [Organisation]
      operationId: listDepartments
      summary: Départements et services
      x-roles: [employee, manager, hr, director]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Department'}}
    post:
      tags: [Organisation]
      operationId: createDepartment
      summary: Créer un département ou un service
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartmentInput'}
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Department'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /departments/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Organisation]
      operationId: updateDepartment
      summary: Modifier un département
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartmentInput'}
      responses:
        '200':
          description: Modifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Department'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Organisation]
      operationId: deleteDepartment
      summary: Supprimer un département vide
      x-roles: [hr]
      responses:
        '204': {description: Supprimé}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ------------------------------------------------------------------ Employés
  /employees:
    get:
      tags: [Employés]
      operationId: listEmployees
      summary: Lister les employés visibles par l'utilisateur
      x-roles: [manager, hr, director]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: department_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/EmployeeStatus'}}
        - {name: q, in: query, description: Recherche par nom ou courriel, schema: {type: string}}
      responses:
        '200':
          description: Page d'employés
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Employee'}}
                  next_cursor: {type: string, nullable: true}
    post:
      tags: [Employés]
      operationId: createEmployee
      summary: Créer un employé et envoyer l'invitation (FONC-010)
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeeInput'}
      responses:
        '201':
          description: Employé créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /employees/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Employés]
      operationId: getEmployee
      summary: Détail d'un employé
      x-roles: [employee, manager, hr, director]
      responses:
        '200':
          description: Employé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Employés]
      operationId: updateEmployee
      summary: Modifier un employé ; champs sensibles contrôlés et journalisés (FONC-015)
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeeUpdate'}
      responses:
        '200':
          description: Employé modifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /employees/{id}/deactivate:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Employés]
      operationId: deactivateEmployee
      summary: Désactiver un employé sortant ; l'historique est conservé (FONC-016)
      x-roles: [hr]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                end_date: {type: string, format: date}
                pending_requests_action: {type: string, enum: [cancel, reassign], description: Traitement des demandes en attente (RG-011)}
      responses:
        '200':
          description: Employé désactivé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /employees/{id}/reactivate:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Employés]
      operationId: reactivateEmployee
      summary: Réactiver un compte désactivé
      x-roles: [hr]
      responses:
        '200':
          description: Employé réactivé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /employees/{id}/invitations:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Employés]
      operationId: resendInvitation
      summary: Renvoyer l'invitation (les précédentes sont révoquées)
      x-roles: [hr]
      responses:
        '202': {description: Invitation envoyée}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /employees/imports:
    post:
      tags: [Employés]
      operationId: createEmployeeImport
      summary: Importer des employés depuis un fichier CSV ou Excel (FONC-011)
      description: Traitement asynchrone. Un aperçu avec rapport d'erreurs est produit ; aucune ligne invalide n'est importée silencieusement (FONC-012).
      x-roles: [hr]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                dry_run: {type: boolean, default: true, description: "Si vrai, valide sans importer"}
      responses:
        '202':
          description: Import accepté
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /employees/imports/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Employés]
      operationId: getEmployeeImport
      summary: État et rapport d'erreurs d'un import
      x-roles: [hr]
      responses:
        '200':
          description: Import
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '404': {$ref: '#/components/responses/NotFound'}
  /employees/imports/{id}/commit:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Employés]
      operationId: commitEmployeeImport
      summary: Confirmer un import validé à blanc
      x-roles: [hr]
      responses:
        '202':
          description: Import lancé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ------------------------------------------------------------------ Types de congés
  /leave-types:
    get:
      tags: [Types de congés]
      operationId: listLeaveTypes
      summary: Types de congés de l'entreprise
      x-roles: [employee, manager, hr, director]
      parameters:
        - {name: active_only, in: query, schema: {type: boolean, default: true}}
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/LeaveType'}}
    post:
      tags: [Types de congés]
      operationId: createLeaveType
      summary: Créer un type de congé (FONC-020)
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveTypeInput'}
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveType'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-types/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Types de congés]
      operationId: updateLeaveType
      summary: Modifier ou désactiver un type de congé
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveTypeInput'}
      responses:
        '200':
          description: Modifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveType'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-types/{id}/policies:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Types de congés]
      operationId: listLeavePolicies
      summary: Règles d'acquisition, de report et d'expiration (À préciser, RG-012)
      x-roles: [hr]
      responses:
        '200':
          description: Règles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/LeavePolicy'}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Types de congés]
      operationId: createLeavePolicy
      summary: Ajouter une règle pour ce type
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeavePolicyInput'}
      responses:
        '201':
          description: Créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeavePolicy'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ------------------------------------------------------------------ Circuits de validation
  /workflows:
    get:
      tags: [Circuits de validation]
      operationId: listWorkflows
      summary: Circuits de validation
      x-roles: [hr]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Workflow'}}
    post:
      tags: [Circuits de validation]
      operationId: createWorkflow
      summary: Créer un circuit (RH seul, responsable hiérarchique, plusieurs étapes — FONC-040)
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowInput'}
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workflow'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /workflows/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Circuits de validation]
      operationId: replaceWorkflow
      summary: Remplacer un circuit (n'affecte que les nouvelles demandes)
      x-roles: [hr]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowInput'}
      responses:
        '200':
          description: Modifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workflow'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ------------------------------------------------------------------ Demandes de congé
  /leave-requests:
    get:
      tags: [Demandes de congé]
      operationId: listLeaveRequests
      summary: Lister les demandes visibles (les siennes pour un employé)
      x-roles: [employee, manager, hr, director]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: employee_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/LeaveRequestStatus'}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: Page de demandes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/LeaveRequest'}}
                  next_cursor: {type: string, nullable: true}
    post:
      tags: [Demandes de congé]
      operationId: createLeaveRequest
      summary: Créer une demande (brouillon ou soumission directe)
      description: "Contrôles serveur : dates, solde, chevauchements, préavis, justificatif, limites d'absences. `Idempotency-Key` évite les doublons en cas de double clic."
      x-roles: [employee, manager, hr, director]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveRequestInput'}
      responses:
        '201':
          description: Demande créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-requests/preview:
    post:
      tags: [Demandes de congé]
      operationId: previewLeaveRequest
      summary: Simuler une demande (nombre de jours, solde, conflits, alertes) sans l'enregistrer
      x-roles: [employee, manager, hr, director]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveRequestInput'}
      responses:
        '200':
          description: Résultat de la simulation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequestPreview'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-requests/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Demandes de congé]
      operationId: getLeaveRequest
      summary: Détail d'une demande avec historique des décisions
      x-roles: [employee, manager, hr, director]
      responses:
        '200':
          description: Demande
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Demandes de congé]
      operationId: updateLeaveRequest
      summary: Modifier un brouillon
      x-roles: [employee, manager, hr, director]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveRequestInput'}
      responses:
        '200':
          description: Demande modifiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-requests/{id}/submit:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Demandes de congé]
      operationId: submitLeaveRequest
      summary: Soumettre un brouillon au circuit de validation
      x-roles: [employee, manager, hr, director]
      responses:
        '200':
          description: Demande soumise
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-requests/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Demandes de congé]
      operationId: cancelLeaveRequest
      summary: Annuler une demande selon les règles de l'entreprise (FONC-029)
      x-roles: [employee, manager, hr, director]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Demande annulée ; solde recrédité si elle était approuvée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /leave-requests/{id}/modification-requests:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Demandes de congé]
      operationId: createModificationRequest
      summary: Demander la modification d'une demande approuvée (nouvelle demande liée, soumise au circuit)
      x-roles: [employee, manager, hr, director]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveRequestInput'}
      responses:
        '201':
          description: Demande de modification créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-requests/{id}/attachments:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Demandes de congé]
      operationId: listAttachments
      summary: Justificatifs d'une demande (demandeur et rôles autorisés)
      x-roles: [employee, hr]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Demandes de congé]
      operationId: uploadAttachment
      summary: Ajouter un justificatif (type réel contrôlé, analyse antivirus — SEC-020)
      x-roles: [employee]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Justificatif reçu (analyse en cours)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /leave-requests/{id}/attachments/{attachmentId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Demandes de congé]
      operationId: downloadAttachment
      summary: Télécharger un justificatif (redirection vers une URL signée de courte durée)
      x-roles: [employee, hr]
      responses:
        '302':
          description: Redirection vers l'URL signée
          headers:
            Location: {schema: {type: string, format: uri}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Demandes de congé]
      operationId: deleteAttachment
      summary: Supprimer un justificatif tant que la demande n'est pas décidée
      x-roles: [employee]
      responses:
        '204': {description: Supprimé}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ------------------------------------------------------------------ Validations
  /approvals:
    get:
      tags: [Validations]
      operationId: listApprovals
      summary: Demandes en attente pour l'utilisateur (FONC-041)
      x-roles: [manager, hr, director]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ApprovalTaskStatus'}}
      responses:
        '200':
          description: Page de tâches de validation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ApprovalTask'}}
                  next_cursor: {type: string, nullable: true}
  /approvals/{id}/approve:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Validations]
      operationId: approveTask
      summary: Approuver. Un valideur ne peut pas approuver sa propre demande (RG-007)
      x-roles: [manager, hr, director]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
      responses:
        '200':
          description: Décision enregistrée (immuable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalTask'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /approvals/{id}/reject:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Validations]
      operationId: rejectTask
      summary: Refuser, avec motif lorsque l'entreprise l'exige (FONC-043)
      x-roles: [manager, hr, director]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
      responses:
        '200':
          description: Décision enregistrée (immuable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalTask'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /approvals/bulk:
    post:
      tags: [Validations]
      operationId: bulkDecideTasks
      summary: Action rapide sur plusieurs demandes (FONC-045) ; chaque élément est contrôlé individuellement
      x-roles: [manager, hr, director]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, task_ids]
              properties:
                action: {type: string, enum: [approve, reject]}
                task_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                comment: {type: string}
      responses:
        '200':
          description: Résultat par élément
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [task_id, ok]
                      properties:
                        task_id: {type: string, format: uuid}
                        ok: {type: boolean}
                        error: {type: string}
        '422': {$ref: '#/components/responses/ValidationError'}
  /approval-delegations:
    get:
      tags: [Validations]
      operationId: listDelegations
      summary: Délégations de validation (FONC-049)
      x-roles: [manager, hr, director]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Delegation'}}
    post:
      tags: [Validations]
      operationId: createDelegation
      summary: Déléguer ses validations pendant une période
      x-roles: [manager, hr, director]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegate_id, start_date, end_date]
              properties:
                delegate_id: {type: string, format: uuid}
                start_date: {type: string, format: date}
                end_date: {type: string, format: date}
      responses:
        '201':
          description: Délégation créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Delegation'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /approval-delegations/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Validations]
      operationId: deleteDelegation
      summary: Supprimer une délégation
      x-roles: [manager, hr, director]
      responses:
        '204': {description: Supprimée}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ Soldes
  /balances:
    get:
      tags: [Soldes]
      operationId: listMyBalances
      summary: Soldes de l'utilisateur connecté par type de congé (FONC-060)
