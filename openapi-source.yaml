          description: Modifiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AbsenceLimit'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
