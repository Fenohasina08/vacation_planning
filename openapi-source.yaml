      responses:
        '200':
          description: Indicateurs du jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}

  # ------------------------------------------------------------------ Exports
  /exports:
    post:
      tags: [Exports]
      operationId: createExport
      summary: Demander un export PDF, Excel ou CSV (FONC-090)
      description: Génération asynchrone. Les permissions sont vérifiées au moment de la génération (FONC-091) ; l'export est journalisé.
      x-roles: [hr, director]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, format]
              properties:
                kind: {type: string, enum: [leave_requests, balances, calendar, employees, audit_logs]}
                format: {$ref: '#/components/schemas/ExportFormat'}
